services:
  postgres:
    image: postgres:16-alpine
    container_name: book-club-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookclub
      POSTGRES_PASSWORD: bookclub
      POSTGRES_DB: bookclub
    ports:
      - "5434:5432"
    volumes:
      - book-club-pgdata:/var/lib/postgresql/data

volumes:
  book-club-pgdata:
